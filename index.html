<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="img">
            <div class="img-box">
                <img src="" alt="" id="img">
            </div>
            <div class="uplode">
                <label for="uplode">uplode</label>
                <input type="file" id="uplode">
            </div>
        </div>
        <div class="filters">
            <ul>
                <li>
                    <label for="saturate">saturate</label>
                    <input type="range" id="saturate" min="0" max="200" value="100">
                </li>
                <li>
                    <label for="contrast">contrast</label>
                    <input type="range" id="contrast" min="0" max="200" value="100">
                </li>
                <li>
                    <label for="brightness">brightness</label>
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </li>
                <li>
                    <label for="sepia">sepia</label>
                    <input type="range" id="sepia" min="0" max="200" value="0">
                </li>
                <li>
                    <label for="grayscale">grayscale</label>
                    <input type="range" id="grayscale" min="0" max="1" value="0" step="0.1">
                </li>
                <li>
                    <label for="blur">blur</label>
                    <input type="range" id="blur" min="0" max="10" value="0" step="0.1">
                </li>
                <li>
                    <label for="hue-rotate">hue-rotate</label>
                    <input type="range" id="hue-rotate" min="0" max="350" value="0" >
                </li>
                <li>
                    <label for="invert">invert</label>
                    <input type="range" id="invert" min="0" max="100" value="0">
                </li>
              <li>
                <a download="true" id="download">Download</a>
                <span id="reset" onclick="resetvalue()">reset</span>
              </li>
            </ul>
        </div>
    </div>




    <script src="main.js"></script>
</body>

</html>
